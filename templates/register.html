{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}

{% block auth_content %}
<div class="auth-wrap">
    <div class="auth-box">
        <div class="auth-logo"><span>▸</span> workout</div>

        <h1 class="auth-title">Регистрация</h1>
        <p class="auth-sub">Создайте аккаунт, чтобы начать</p>

        <div class="auth-error" id="error"></div>

        <form class="auth-form" id="regForm">
            <div class="form-group">
                <label class="form-label">Имя пользователя</label>
                <input type="text" id="username" placeholder="username" required minlength="1" maxlength="50">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="login" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" id="password" placeholder="минимум 6 символов" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="submitBtn">
                Создать аккаунт
            </button>
        </form>

        <p class="auth-switch">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('error');
    err.style.display = 'none';
    setLoading(btn, true);

    try {
        await post('/users/register', {
            username: document.getElementById('username').value,
            login: document.getElementById('login').value,
            password: document.getElementById('password').value,
        });
        window.location.href = '/login';
    } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        setLoading(btn, false);
    }
});
</script>
{% endblock %}
